<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場スキャンWeb v33</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <meta name="theme-color" content="#212529">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f8f9fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 140px;
            margin: 0;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 0.75rem;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
        }

        #cameraContainer {
            position: relative;
            width: 100%;
            height: 55vh;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas,
        #processCanvas {
            display: none;
        }

        .guide-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 15%;
            border: 2px solid #4ade80;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .corner-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #22c55e;
            border-style: solid;
            border-width: 0;
        }

        .corner-tl {
            top: -2px;
            left: -2px;
            border-top-width: 4px;
            border-left-width: 4px;
            border-top-left-radius: 8px;
        }

        .corner-tr {
            top: -2px;
            right: -2px;
            border-top-width: 4px;
            border-right-width: 4px;
            border-top-right-radius: 8px;
        }

        .corner-bl {
            bottom: -2px;
            left: -2px;
            border-bottom-width: 4px;
            border-left-width: 4px;
            border-bottom-left-radius: 8px;
        }

        .corner-br {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 4px;
            border-right-width: 4px;
            border-bottom-right-radius: 8px;
        }

        .guide-processing {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(74, 222, 128, 0.25);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 1s ease-in-out infinite;
        }

        .guide-processing.d-none {
            display: none !important;
        }

        .guide-processing span {
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .guide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 80px));
            color: #4ade80;
            font-size: 0.9rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .list-section {
            padding: 1rem;
        }

        .scan-list {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 1rem;
            border: 1px solid #444;
        }

        .scan-item {
            padding: 1rem;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            color: white;
        }

        .scan-item:last-child {
            border-bottom: none;
        }

        .scan-item .code {
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
        }

        .scan-item .code:hover {
            background: #444;
        }

        .text-large {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-send {
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .shutter-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), transparent);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            z-index: 1000;
        }

        .shutter-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #dc2626;
            border: 4px solid white;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shutter-btn::after {
            content: '';
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .shutter-btn:active {
            transform: scale(0.9);
            background: #b91c1c;
        }

        .shutter-btn:disabled {
            background: #6b7280;
            border-color: #9ca3af;
            box-shadow: none;
        }

        .rotate-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #444;
            border: 2px solid #666;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }

        .loading-overlay.d-none {
            display: none !important;
        }

        .accordion-button {
            background-color: #333;
            color: white;
        }

        .accordion-button:not(.collapsed) {
            background-color: #444;
            color: white;
        }

        .accordion-body {
            background-color: #2a2a2a;
        }

        .form-label {
            color: white;
        }

        .counter-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #4ade80;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .rotation-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 165, 0, 0.9);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .model-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 200, 100, 0.9);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .error-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            z-index: 3000;
            text-align: center;
            max-width: 90%;
        }

        .error-toast.d-none {
            display: none !important;
        }

        .success-toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 135, 84, 0.95);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            z-index: 3000;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .success-toast.d-none {
            display: none !important;
        }

        .confirm-dialog,
        .edit-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .confirm-dialog.d-none,
        .edit-dialog.d-none {
            display: none !important;
        }

        .confirm-content,
        .edit-content {
            background: #333;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
        }

        .edit-content {
            width: 90%;
            max-width: 400px;
        }

        .confirm-buttons {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .debug-section {
            padding: 1rem;
            background: #111;
            border-top: 1px solid #333;
        }

        .debug-section h6 {
            color: #ff0;
            margin-bottom: 0.5rem;
        }

        #debugCanvas {
            width: 100%;
            max-height: 120px;
            border: 2px solid #ff0;
            border-radius: 8px;
            object-fit: contain;
        }

        .debug-info {
            color: #888;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .timing-info {
            color: #0ff;
            font-size: 0.7rem;
            margin-top: 0.3rem;
        }

        .edit-content input {
            font-size: 1.5rem;
            font-family: monospace;
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="loading-overlay d-none" id="loadingOverlay">
        <div class="spinner-border text-light mb-3" role="status"></div>
        <div id="loadingText">読み取り中...</div>
    </div>

    <div class="error-toast d-none" id="errorToast">
        <div id="errorText"></div>
        <button class="btn btn-light btn-sm mt-2" onclick="hideError()">閉じる</button>
    </div>

    <div class="success-toast d-none" id="successToast"></div>

    <div class="confirm-dialog d-none" id="confirmDialog">
        <div class="confirm-content">
            <div id="confirmText"></div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" id="confirmCancel">キャンセル</button>
                <button class="btn btn-danger" id="confirmOk">削除</button>
            </div>
        </div>
    </div>

    <div class="edit-dialog d-none" id="editDialog">
        <div class="edit-content">
            <h5 class="text-white mb-3">読み取り結果を修正</h5>
            <input type="text" class="form-control form-control-lg mb-3" id="editInput" placeholder="番号を入力">
            <div class="d-flex gap-2">
                <button class="btn btn-secondary flex-fill" id="editCancel">キャンセル</button>
                <button class="btn btn-primary flex-fill" id="editSave">保存</button>
            </div>
        </div>
    </div>

    <div class="header">現場スキャンWeb v33</div>

    <div id="cameraContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="guide-frame" id="guideFrame">
            <div class="corner-marker corner-tl"></div>
            <div class="corner-marker corner-tr"></div>
            <div class="corner-marker corner-bl"></div>
            <div class="corner-marker corner-br"></div>
            <div class="guide-processing d-none" id="guideProcessing"><span>解析中...</span></div>
        </div>
        <div class="guide-text">枠内に番号を合わせてください</div>
        <div class="counter-badge"><span id="scanCount">0</span> 件</div>
        <div class="rotation-badge" id="rotationBadge">回転: 0°</div>
        <div class="model-badge" id="modelBadge">準備中...</div>
    </div>
    <canvas id="canvas"></canvas>
    <canvas id="processCanvas"></canvas>

    <div class="debug-section">
        <h6>OCR処理画像<span id="debugRotation"></span></h6>
        <canvas id="debugCanvas"></canvas>
        <div class="debug-info" id="debugInfo"></div>
        <div class="timing-info" id="timingInfo"></div>
    </div>

    <div class="list-section">
        <div class="accordion mb-3" id="settingsAccordion">
            <div class="accordion-item border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseSettings">⚙️ 設定</button>
                </h2>
                <div id="collapseSettings" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label for="emailTo" class="form-label">送信先メールアドレス</label>
                            <input type="email" class="form-control form-control-lg" id="emailTo"
                                placeholder="example@company.com">
                        </div>
                        <div class="mb-3">
                            <label for="emailSubject" class="form-label">件名テンプレート</label>
                            <input type="text" class="form-control form-control-lg" id="emailSubject" value="在庫報告">
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="preventDuplicate" checked>
                            <label class="form-check-label text-white" for="preventDuplicate">重複読み取り防止</label>
                        </div>
                        <hr class="border-secondary">
                        <div class="mb-3">
                            <label for="contrastSlider" class="form-label">コントラスト: <span
                                    id="contrastValue">1.4</span></label>
                            <input type="range" class="form-range" id="contrastSlider" min="1.0" max="2.5" step="0.1"
                                value="1.4">
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="colorEnhance" checked>
                            <label class="form-check-label text-white" for="colorEnhance">カラー文字強調</label>
                        </div>
                        <button class="btn btn-primary w-100 btn-lg" id="saveSettings">設定を保存</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-large">読み取りリスト <small class="text-muted">(タップで編集)</small></span>
            <button class="btn btn-outline-danger btn-sm" id="clearList">全削除</button>
        </div>
        <div class="scan-list" id="scanList">
            <div class="p-3 text-center text-muted">データがありません。</div>
        </div>

        <button class="btn btn-primary w-100 btn-send" id="sendEmail">📧 メールで送信</button>
    </div>

    <div class="shutter-bar">
        <button class="rotate-btn" id="rotateBtn" title="画像を回転">🔄</button>
        <button class="shutter-btn" id="shutterBtn" disabled></button>
        <button class="rotate-btn" id="rotateBtnCCW" title="逆回転">↺</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        // v33: パフォーマンス最適化 + HSV彩度強調 + タイミング計測
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';
        env.allowLocalModels = false;

        let scanResults = [];
        let preventDuplicate = true;
        let contrastLevel = 1.4;
        let colorEnhance = true;
        let stream = null;
        let isReady = false;
        let isProcessing = false;
        let confirmCallback = null;
        let rotationAngle = 0;
        let ocrPipeline = null;
        let ocrReady = false;
        let editIndex = -1;

        // キャッシュ用Canvas（再利用）
        let cachedTmpCanvas = null;
        let cachedPaddedCanvas = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const processCanvas = document.getElementById('processCanvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });
        const debugCanvas = document.getElementById('debugCanvas');
        const debugCtx = debugCanvas.getContext('2d');
        const debugInfo = document.getElementById('debugInfo');
        const debugRotation = document.getElementById('debugRotation');
        const timingInfo = document.getElementById('timingInfo');
        const guideFrame = document.getElementById('guideFrame');
        const guideProcessing = document.getElementById('guideProcessing');
        const cameraContainer = document.getElementById('cameraContainer');
        const rotationBadge = document.getElementById('rotationBadge');
        const modelBadge = document.getElementById('modelBadge');
        const shutterBtn = document.getElementById('shutterBtn');
        const scanList = document.getElementById('scanList');
        const scanCount = document.getElementById('scanCount');
        const preventDuplicateCheckbox = document.getElementById('preventDuplicate');
        const colorEnhanceCheckbox = document.getElementById('colorEnhance');
        const errorToast = document.getElementById('errorToast');
        const errorText = document.getElementById('errorText');
        const successToast = document.getElementById('successToast');
        const confirmDialog = document.getElementById('confirmDialog');
        const confirmText = document.getElementById('confirmText');
        const editDialog = document.getElementById('editDialog');
        const editInput = document.getElementById('editInput');
        const contrastSlider = document.getElementById('contrastSlider');
        const contrastValue = document.getElementById('contrastValue');

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playBeep() {
            try {
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) { }
        }

        window.showError = function (msg) { errorText.textContent = msg; errorToast.classList.remove('d-none'); };
        window.hideError = function () { errorToast.classList.add('d-none'); };
        function showSuccess(msg) { successToast.textContent = msg; successToast.classList.remove('d-none'); setTimeout(() => successToast.classList.add('d-none'), 1500); }
        function showConfirmDialog(msg, onConfirm) { confirmText.textContent = msg; confirmCallback = onConfirm; confirmDialog.classList.remove('d-none'); }
        function hideConfirmDialog() { confirmDialog.classList.add('d-none'); confirmCallback = null; }
        function showEditDialog(index) { editIndex = index; editInput.value = scanResults[index]; editDialog.classList.remove('d-none'); editInput.focus(); editInput.select(); }
        function hideEditDialog() { editDialog.classList.add('d-none'); editIndex = -1; }
        function saveEdit() { if (editIndex >= 0 && editInput.value.trim()) { scanResults[editIndex] = editInput.value.trim().toUpperCase(); saveToLocal(); updateUI(); showSuccess('修正しました'); } hideEditDialog(); }

        document.getElementById('confirmOk').addEventListener('click', () => { if (confirmCallback) confirmCallback(); hideConfirmDialog(); });
        document.getElementById('confirmCancel').addEventListener('click', hideConfirmDialog);
        document.getElementById('editSave').addEventListener('click', saveEdit);
        document.getElementById('editCancel').addEventListener('click', hideEditDialog);
        editInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') hideEditDialog(); });

        document.getElementById('rotateBtn').addEventListener('click', () => { rotationAngle = (rotationAngle + 90) % 360; updateRotationDisplay(); localStorage.setItem('fieldScan_rotation', rotationAngle); });
        document.getElementById('rotateBtnCCW').addEventListener('click', () => { rotationAngle = (rotationAngle - 90 + 360) % 360; updateRotationDisplay(); localStorage.setItem('fieldScan_rotation', rotationAngle); });
        contrastSlider.addEventListener('input', () => { contrastLevel = parseFloat(contrastSlider.value); contrastValue.textContent = contrastLevel.toFixed(1); });

        function updateRotationDisplay() { rotationBadge.textContent = `回転: ${rotationAngle}°`; debugRotation.textContent = ` (${rotationAngle}°)`; }

        async function initOCR() {
            modelBadge.textContent = 'AI読込中...';
            modelBadge.style.background = 'rgba(255,165,0,0.9)';
            try {
                ocrPipeline = await pipeline('image-to-text', 'Xenova/trocr-small-printed', {
                    dtype: 'q4', device: 'webgpu',
                    progress_callback: (p) => { if (p.status === 'downloading') { modelBadge.textContent = `DL: ${Math.round((p.loaded / p.total) * 100)}%`; } }
                });
                ocrReady = true;
                modelBadge.textContent = 'TrOCR (GPU)';
                modelBadge.style.background = 'rgba(0,200,100,0.9)';
            } catch (err) {
                console.warn('WebGPU failed:', err);
                try {
                    ocrPipeline = await pipeline('image-to-text', 'Xenova/trocr-small-printed', { dtype: 'q8', device: 'wasm' });
                    ocrReady = true;
                    modelBadge.textContent = 'TrOCR (CPU)';
                    modelBadge.style.background = 'rgba(0,150,150,0.9)';
                } catch (e) { modelBadge.textContent = 'エラー'; modelBadge.style.background = 'rgba(220,53,69,0.9)'; showError('OCR初期化失敗'); }
            }
        }

        async function startCamera() {
            try {
                initAudio();
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } });
                video.srcObject = stream;
                video.onloadedmetadata = () => { isReady = true; shutterBtn.disabled = false; };
            } catch (e) { showError("カメラ起動失敗: " + e.message); }
        }

        function calculateCropRegion() {
            const cW = cameraContainer.clientWidth, cH = cameraContainer.clientHeight;
            const vW = video.videoWidth, vH = video.videoHeight;
            const cRatio = cW / cH, vRatio = vW / vH;
            let visW, visH, offX, offY;
            if (vRatio > cRatio) { visH = vH; visW = cRatio * vH; offX = (vW - visW) / 2; offY = 0; }
            else { visW = vW; visH = vW / cRatio; offX = 0; offY = (vH - visH) / 2; }
            const gRect = guideFrame.getBoundingClientRect(), cRect = cameraContainer.getBoundingClientRect();
            const gRelX = (gRect.left - cRect.left) / cW, gRelY = (gRect.top - cRect.top) / cH;
            const gRelW = gRect.width / cW, gRelH = gRect.height / cH;
            return { x: Math.floor(offX + gRelX * visW), y: Math.floor(offY + gRelY * visH), w: Math.floor(gRelW * visW), h: Math.floor(gRelH * visH) };
        }

        function preprocessImage(src) {
            const crop = calculateCropRegion();
            const sW = src.width, sH = src.height;
            let aC = { ...crop };
            if (rotationAngle === 90) aC = { x: crop.y, y: sH - crop.x - crop.w, w: crop.h, h: crop.w };
            else if (rotationAngle === 180) aC = { x: sW - crop.x - crop.w, y: sH - crop.y - crop.h, w: crop.w, h: crop.h };
            else if (rotationAngle === 270) aC = { x: sW - crop.y - crop.h, y: crop.x, w: crop.h, h: crop.w };
            aC.x = Math.max(0, Math.min(aC.x, sW - 1)); aC.y = Math.max(0, Math.min(aC.y, sH - 1));
            aC.w = Math.min(aC.w, sW - aC.x); aC.h = Math.min(aC.h, sH - aC.y);

            // 最適化: 384幅（TrOCR標準入力サイズ）
            const tW = 384, scale = tW / aC.w, tH = Math.floor(aC.h * scale);
            processCanvas.width = tW; processCanvas.height = tH;
            processCtx.save();

            if (rotationAngle !== 0) {
                if (!cachedTmpCanvas) cachedTmpCanvas = document.createElement('canvas');
                cachedTmpCanvas.width = aC.w; cachedTmpCanvas.height = aC.h;
                cachedTmpCanvas.getContext('2d').drawImage(src, aC.x, aC.y, aC.w, aC.h, 0, 0, aC.w, aC.h);
                if (rotationAngle === 90 || rotationAngle === 270) { processCanvas.width = tH; processCanvas.height = tW; }
                processCtx.translate(processCanvas.width / 2, processCanvas.height / 2);
                processCtx.rotate(rotationAngle * Math.PI / 180);
                processCtx.drawImage(cachedTmpCanvas, -aC.w * scale / 2, -aC.h * scale / 2, aC.w * scale, aC.h * scale);
            } else {
                processCtx.drawImage(src, aC.x, aC.y, aC.w, aC.h, 0, 0, tW, tH);
            }
            processCtx.restore();

            const w = processCanvas.width, h = processCanvas.height;
            const imgData = processCtx.getImageData(0, 0, w, h);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
                const r = d[i], g = d[i + 1], b = d[i + 2];

                // HSV彩度チャネル活用（カラー文字強調）
                if (colorEnhance) {
                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const sat = max === 0 ? 0 : (max - min) / max;

                    if (sat > 0.25) {
                        // 彩度が高い → カラー文字 → 暗く表示
                        d[i] = d[i + 1] = d[i + 2] = 0;
                        continue;
                    }
                }

                // 通常グレースケール + コントラスト
                let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                gray = ((gray - 128) * contrastLevel) + 128;
                gray = Math.max(0, Math.min(255, gray));
                d[i] = d[i + 1] = d[i + 2] = gray;
            }
            processCtx.putImageData(imgData, 0, 0);
            return processCanvas;
        }

        function postProcessText(text) {
            let r = text.replace(/[^A-Za-z0-9.]/g, '').toUpperCase();
            r = r.replace(/^(R|RC|INC|REC|GST)(?=[A-Z]?\d)/i, '');
            r = r.replace(/^THNO/i, 'CHNO').replace(/^ITHNG/i, 'CHNO');
            r = r.replace(/^AN0/i, 'NO.').replace(/^ANO/i, 'NO.');
            return r;
        }

        async function captureAndRecognize() {
            if (!isReady || isProcessing || !ocrReady) { if (!ocrReady) showError("OCR準備中..."); return; }
            isProcessing = true; shutterBtn.disabled = true; guideProcessing.classList.remove('d-none');

            const t0 = performance.now();

            try {
                // キャプチャ
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                const t1 = performance.now();

                // 前処理
                const processed = preprocessImage(canvas);
                const t2 = performance.now();

                // パディング（キャッシュ使用）
                const padL = 40, padR = 80;
                if (!cachedPaddedCanvas) cachedPaddedCanvas = document.createElement('canvas');
                cachedPaddedCanvas.width = processed.width + padL + padR;
                cachedPaddedCanvas.height = processed.height;
                const pCtx = cachedPaddedCanvas.getContext('2d');
                pCtx.fillStyle = '#FFFFFF';
                pCtx.fillRect(0, 0, cachedPaddedCanvas.width, cachedPaddedCanvas.height);
                pCtx.drawImage(processed, padL, 0);
                const t3 = performance.now();

                // デバッグ表示
                debugCanvas.width = cachedPaddedCanvas.width;
                debugCanvas.height = cachedPaddedCanvas.height;
                debugCtx.drawImage(cachedPaddedCanvas, 0, 0);

                // OCR推論
                const result = await ocrPipeline(cachedPaddedCanvas);
                const t4 = performance.now();

                let text = postProcessText(result[0]?.generated_text || '');

                // タイミング表示
                const timeCap = (t1 - t0).toFixed(0);
                const timePrep = (t2 - t1).toFixed(0);
                const timePad = (t3 - t2).toFixed(0);
                const timeOCR = (t4 - t3).toFixed(0);
                const timeTotal = (t4 - t0).toFixed(0);
                timingInfo.textContent = `⏱ キャプチャ:${timeCap}ms 前処理:${timePrep}ms パディング:${timePad}ms OCR:${timeOCR}ms 合計:${timeTotal}ms`;

                debugInfo.textContent = `TrOCR | ${text} | コントラスト:${contrastLevel} カラー強調:${colorEnhance ? 'ON' : 'OFF'}`;

                if (text.length > 0) { showSuccess(`読取: ${text}`); addScanResult(text); }
                else { showError("認識できませんでした"); }
            } catch (e) { console.error(e); showError("OCRエラー"); }
            finally { guideProcessing.classList.add('d-none'); shutterBtn.disabled = false; isProcessing = false; }
        }

        function saveToLocal() { try { localStorage.setItem('fieldScan_results', JSON.stringify(scanResults)); } catch (e) { } }
        function loadFromLocal() {
            try {
                const s = localStorage.getItem('fieldScan_results'); if (s) { scanResults = JSON.parse(s); updateUI(); }
                const e = localStorage.getItem('fieldScan_emailTo'); if (e) document.getElementById('emailTo').value = e;
                const es = localStorage.getItem('fieldScan_emailSubject'); if (es) document.getElementById('emailSubject').value = es;
                const p = localStorage.getItem('fieldScan_preventDuplicate'); if (p !== null) { preventDuplicate = p === 'true'; preventDuplicateCheckbox.checked = preventDuplicate; }
                const r = localStorage.getItem('fieldScan_rotation'); if (r !== null) { rotationAngle = parseInt(r) || 0; updateRotationDisplay(); }
                const c = localStorage.getItem('fieldScan_contrast'); if (c !== null) { contrastLevel = parseFloat(c); contrastSlider.value = contrastLevel; contrastValue.textContent = contrastLevel.toFixed(1); }
                const ce = localStorage.getItem('fieldScan_colorEnhance'); if (ce !== null) { colorEnhance = ce === 'true'; colorEnhanceCheckbox.checked = colorEnhance; }
            } catch (e) { }
        }
        function saveSettings() {
            try {
                localStorage.setItem('fieldScan_emailTo', document.getElementById('emailTo').value);
                localStorage.setItem('fieldScan_emailSubject', document.getElementById('emailSubject').value);
                preventDuplicate = preventDuplicateCheckbox.checked;
                localStorage.setItem('fieldScan_preventDuplicate', preventDuplicate);
                localStorage.setItem('fieldScan_contrast', contrastLevel);
                colorEnhance = colorEnhanceCheckbox.checked;
                localStorage.setItem('fieldScan_colorEnhance', colorEnhance);
                showSuccess("設定を保存しました");
                bootstrap.Collapse.getInstance(document.getElementById('collapseSettings'))?.hide();
            } catch (e) { showError("保存失敗"); }
        }
        function addScanResult(code) {
            if (preventDuplicate && scanResults.includes(code)) { showError("重複: " + code); return; }
            playBeep(); scanResults.unshift(code); saveToLocal(); updateUI();
        }
        window.removeScanResult = function (i) { scanResults.splice(i, 1); saveToLocal(); updateUI(); };
        window.editScanResult = function (i) { showEditDialog(i); };
        function clearAll() { showConfirmDialog("リストをすべて削除しますか？", () => { scanResults = []; saveToLocal(); updateUI(); showSuccess("削除しました"); }); }
        function updateUI() {
            scanCount.innerText = scanResults.length;
            if (scanResults.length === 0) { scanList.innerHTML = '<div class="p-3 text-center text-muted">データがありません。</div>'; }
            else { scanList.innerHTML = scanResults.map((c, i) => `<div class="scan-item"><span class="code" onclick="editScanResult(${i})">${c}</span><button class="btn btn-outline-danger btn-sm" onclick="removeScanResult(${i})">削除</button></div>`).join(''); }
        }
        function sendEmail() {
            const to = document.getElementById('emailTo').value, sub = document.getElementById('emailSubject').value;
            if (!to) { showError("送信先を設定してください"); return; }
            if (scanResults.length === 0) { showError("データがありません"); return; }
            window.location.href = `mailto:${to}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(scanResults.join('\n'))}`;
        }

        shutterBtn.addEventListener('click', captureAndRecognize);
        document.getElementById('clearList').addEventListener('click', clearAll);
        document.getElementById('saveSettings').addEventListener('click', saveSettings);
        document.getElementById('sendEmail').addEventListener('click', sendEmail);

        window.addEventListener('load', async () => { loadFromLocal(); await startCamera(); await initOCR(); });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e => { }); }); }
    </script>
</body>

</html>
