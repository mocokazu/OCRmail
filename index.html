<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場スキャンWeb - OCR</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <meta name="theme-color" content="#212529">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #1a1a1a;
            --text-color: #f8f9fa;
            --shutter-size: 70px;
        }

        body {
            font-family: 'Inter', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 120px;
            margin: 0;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 0.75rem;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
        }

        #cameraContainer {
            position: relative;
            width: 100%;
            height: 55vh;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas,
        #processCanvas {
            display: none;
        }

        .guide-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 15%;
            border: 3px solid #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .guide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 80px));
            color: #00ff00;
            font-size: 0.9rem;
            text-shadow: 0 0 5px black;
        }

        .list-section {
            padding: 1rem;
        }

        .scan-list {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 1rem;
            border: 1px solid #444;
        }

        .scan-item {
            padding: 1rem;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            color: white;
        }

        .scan-item:last-child {
            border-bottom: none;
        }

        .scan-item .code {
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .text-large {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-send {
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .shutter-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            z-index: 1000;
        }

        .shutter-btn {
            width: var(--shutter-size);
            height: var(--shutter-size);
            border-radius: 50%;
            background: white;
            border: 4px solid #ccc;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .shutter-btn:active {
            transform: scale(0.9);
            background: #ddd;
        }

        .shutter-btn:disabled {
            background: #666;
            border-color: #888;
        }

        .rotate-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #444;
            border: 2px solid #666;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rotate-btn:active {
            background: #555;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }

        .loading-overlay.d-none {
            display: none !important;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        .accordion-button {
            background-color: #333;
            color: white;
        }

        .accordion-button:not(.collapsed) {
            background-color: #444;
            color: white;
        }

        .accordion-body {
            background-color: #2a2a2a;
        }

        .form-label {
            color: white;
        }

        .counter-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .rotation-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 165, 0, 0.9);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .model-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 128, 255, 0.9);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .error-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            z-index: 3000;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .error-toast.d-none {
            display: none !important;
        }

        .success-toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 135, 84, 0.95);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            z-index: 3000;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .success-toast.d-none {
            display: none !important;
        }

        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .confirm-dialog.d-none {
            display: none !important;
        }

        .confirm-content {
            background: #333;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
        }

        .confirm-buttons {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .confirm-buttons .btn {
            min-width: 100px;
        }

        .debug-section {
            padding: 1rem;
            background: #111;
            border-top: 1px solid #333;
        }

        .debug-section h6 {
            color: #ff0;
            margin-bottom: 0.5rem;
        }

        #debugCanvas {
            width: 100%;
            max-height: 120px;
            border: 2px solid #ff0;
            border-radius: 8px;
            object-fit: contain;
        }

        .debug-info {
            color: #888;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            word-break: break-all;
        }

        .progress-bar-container {
            width: 80%;
            height: 10px;
            background: #444;
            border-radius: 5px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0d6efd, #00ff00);
            transition: width 0.3s;
        }
    </style>
</head>

<body>
    <div class="loading-overlay d-none" id="loadingOverlay">
        <div class="spinner-border text-light mb-3" role="status"></div>
        <div id="loadingText">読み取り中...</div>
        <div class="progress-bar-container" id="progressContainer" style="display:none;">
            <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
        </div>
    </div>

    <div class="error-toast d-none" id="errorToast">
        <div id="errorText"></div>
        <button class="btn btn-light btn-sm mt-2" onclick="hideError()">閉じる</button>
    </div>

    <div class="success-toast d-none" id="successToast"></div>

    <div class="confirm-dialog d-none" id="confirmDialog">
        <div class="confirm-content">
            <div id="confirmText"></div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" id="confirmCancel">キャンセル</button>
                <button class="btn btn-danger" id="confirmOk">削除</button>
            </div>
        </div>
    </div>

    <div class="header">現場スキャンWeb</div>

    <div id="cameraContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="guide-frame" id="guideFrame"></div>
        <div class="guide-text">枠内に文字を合わせてください</div>
        <div class="counter-badge"><span id="scanCount">0</span> 件</div>
        <div class="rotation-badge" id="rotationBadge">回転: 0°</div>
        <div class="model-badge" id="modelBadge">読込中...</div>
    </div>
    <canvas id="canvas"></canvas>
    <canvas id="processCanvas"></canvas>

    <div class="debug-section">
        <h6>📷 OCR処理画像（デバッグ用）<span id="debugRotation"></span></h6>
        <canvas id="debugCanvas"></canvas>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <div class="list-section">
        <div class="accordion mb-3" id="settingsAccordion">
            <div class="accordion-item border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseSettings">
                        ⚙️ 設定（送信先・件名）
                    </button>
                </h2>
                <div id="collapseSettings" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label for="emailTo" class="form-label">送信先メールアドレス</label>
                            <input type="email" class="form-control form-control-lg" id="emailTo"
                                placeholder="example@company.com">
                        </div>
                        <div class="mb-3">
                            <label for="emailSubject" class="form-label">件名テンプレート</label>
                            <input type="text" class="form-control form-control-lg" id="emailSubject" value="在庫報告">
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="preventDuplicate" checked>
                            <label class="form-check-label text-white" for="preventDuplicate">重複読み取り防止</label>
                        </div>
                        <button class="btn btn-primary w-100 btn-lg" id="saveSettings">設定を保存</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-large">読み取りリスト</span>
            <button class="btn btn-outline-danger btn-sm" id="clearList">全削除</button>
        </div>
        <div class="scan-list" id="scanList">
            <div class="p-3 text-center text-muted">データがありません。</div>
        </div>

        <button class="btn btn-primary w-100 btn-send" id="sendEmail">📧 メールで送信</button>
    </div>

    <div class="shutter-bar">
        <button class="rotate-btn" id="rotateBtn" title="画像を回転">🔄</button>
        <button class="shutter-btn" id="shutterBtn" disabled></button>
        <button class="rotate-btn" id="rotateBtnCCW" title="逆回転">↺</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        // Transformers.js (TrOCR)
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

        // モデルキャッシュ設定
        env.cacheDir = './.cache';
        env.allowLocalModels = false;

        let scanResults = [];
        let preventDuplicate = true;
        let stream = null;
        let isReady = false;
        let isProcessing = false;
        let confirmCallback = null;
        let rotationAngle = 0;
        let ocrPipeline = null;
        let ocrReady = false;
        let useFallback = false;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const processCanvas = document.getElementById('processCanvas');
        const processCtx = processCanvas.getContext('2d');
        const debugCanvas = document.getElementById('debugCanvas');
        const debugCtx = debugCanvas.getContext('2d');
        const debugInfo = document.getElementById('debugInfo');
        const debugRotation = document.getElementById('debugRotation');
        const guideFrame = document.getElementById('guideFrame');
        const cameraContainer = document.getElementById('cameraContainer');
        const rotationBadge = document.getElementById('rotationBadge');
        const modelBadge = document.getElementById('modelBadge');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playBeep() {
            try {
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) { console.warn("Audio error:", e); }
        }

        const shutterBtn = document.getElementById('shutterBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const rotateBtnCCW = document.getElementById('rotateBtnCCW');
        const scanList = document.getElementById('scanList');
        const scanCount = document.getElementById('scanCount');
        const preventDuplicateCheckbox = document.getElementById('preventDuplicate');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const errorToast = document.getElementById('errorToast');
        const errorText = document.getElementById('errorText');
        const successToast = document.getElementById('successToast');
        const confirmDialog = document.getElementById('confirmDialog');
        const confirmText = document.getElementById('confirmText');

        window.showError = function (msg) { errorText.textContent = msg; errorToast.classList.remove('d-none'); };
        window.hideError = function () { errorToast.classList.add('d-none'); };
        function showSuccess(msg) {
            successToast.textContent = msg;
            successToast.classList.remove('d-none');
            setTimeout(() => successToast.classList.add('d-none'), 1500);
        }
        function showConfirmDialog(msg, onConfirm) {
            confirmText.textContent = msg;
            confirmCallback = onConfirm;
            confirmDialog.classList.remove('d-none');
        }
        function hideConfirmDialog() { confirmDialog.classList.add('d-none'); confirmCallback = null; }

        document.getElementById('confirmOk').addEventListener('click', () => { if (confirmCallback) confirmCallback(); hideConfirmDialog(); });
        document.getElementById('confirmCancel').addEventListener('click', hideConfirmDialog);

        rotateBtn.addEventListener('click', () => {
            rotationAngle = (rotationAngle + 90) % 360;
            updateRotationDisplay();
            localStorage.setItem('fieldScan_rotation', rotationAngle);
        });

        rotateBtnCCW.addEventListener('click', () => {
            rotationAngle = (rotationAngle - 90 + 360) % 360;
            updateRotationDisplay();
            localStorage.setItem('fieldScan_rotation', rotationAngle);
        });

        function updateRotationDisplay() {
            rotationBadge.textContent = `回転: ${rotationAngle}°`;
            debugRotation.textContent = ` (${rotationAngle}°)`;
        }

        // TrOCRパイプライン初期化
        async function initOCR() {
            modelBadge.textContent = 'AI読込中...';
            modelBadge.style.background = 'rgba(255,165,0,0.9)';

            try {
                ocrPipeline = await pipeline('image-to-text', 'Xenova/trocr-small-printed', {
                    progress_callback: (progress) => {
                        if (progress.status === 'downloading') {
                            const pct = Math.round((progress.loaded / progress.total) * 100);
                            modelBadge.textContent = `DL: ${pct}%`;
                        }
                    }
                });
                ocrReady = true;
                useFallback = false;
                modelBadge.textContent = 'TrOCR';
                modelBadge.style.background = 'rgba(0,200,100,0.9)';
                console.log('TrOCR initialized successfully');
            } catch (err) {
                console.error('TrOCR init failed, using Tesseract fallback:', err);
                useFallback = true;
                modelBadge.textContent = 'Tesseract';
                modelBadge.style.background = 'rgba(200,100,0,0.9)';
                // Tesseract.jsをフォールバックとして動的ロード
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                document.head.appendChild(script);
            }
        }

        async function startCamera() {
            try {
                initAudio();
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showError("カメラ非対応のブラウザです");
                    return;
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => { isReady = true; shutterBtn.disabled = false; };
            } catch (err) {
                let msg = "カメラ起動失敗: ";
                if (err.name === 'NotAllowedError') msg += "カメラ権限を許可してください";
                else if (err.name === 'NotFoundError') msg += "カメラが見つかりません";
                else msg += err.message;
                showError(msg);
            }
        }

        function calculateCropRegion() {
            const containerW = cameraContainer.clientWidth;
            const containerH = cameraContainer.clientHeight;
            const videoW = video.videoWidth;
            const videoH = video.videoHeight;

            const containerRatio = containerW / containerH;
            const videoRatio = videoW / videoH;

            let visibleW, visibleH, offsetX, offsetY;

            if (videoRatio > containerRatio) {
                visibleH = videoH;
                visibleW = containerRatio * videoH;
                offsetX = (videoW - visibleW) / 2;
                offsetY = 0;
            } else {
                visibleW = videoW;
                visibleH = videoW / containerRatio;
                offsetX = 0;
                offsetY = (videoH - visibleH) / 2;
            }

            const guideRect = guideFrame.getBoundingClientRect();
            const containerRect = cameraContainer.getBoundingClientRect();

            const guideRelX = (guideRect.left - containerRect.left) / containerW;
            const guideRelY = (guideRect.top - containerRect.top) / containerH;
            const guideRelW = guideRect.width / containerW;
            const guideRelH = guideRect.height / containerH;

            const cropX = offsetX + guideRelX * visibleW;
            const cropY = offsetY + guideRelY * visibleH;
            const cropW = guideRelW * visibleW;
            const cropH = guideRelH * visibleH;

            return {
                x: Math.floor(cropX),
                y: Math.floor(cropY),
                w: Math.floor(cropW),
                h: Math.floor(cropH)
            };
        }

        function calculateSharpness(ctx, width, height) {
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            let score = 0;
            const stride = 4;
            for (let y = 0; y < height; y += stride) {
                for (let x = 0; x < width - 1; x += stride) {
                    const i = (y * width + x) * 4;
                    const nextI = (y * width + (x + 1)) * 4;
                    const diff = Math.abs(data[i] - data[nextI]);
                    score += diff;
                }
            }
            return score;
        }

        function preprocessImage(src) {
            const crop = calculateCropRegion();
            const srcW = src.width;
            const srcH = src.height;

            let actualCrop = { ...crop };

            if (rotationAngle === 90) {
                actualCrop = { x: crop.y, y: srcH - crop.x - crop.w, w: crop.h, h: crop.w };
            } else if (rotationAngle === 180) {
                actualCrop = { x: srcW - crop.x - crop.w, y: srcH - crop.y - crop.h, w: crop.w, h: crop.h };
            } else if (rotationAngle === 270) {
                actualCrop = { x: srcW - crop.y - crop.h, y: crop.x, w: crop.h, h: crop.w };
            }

            actualCrop.x = Math.max(0, Math.min(actualCrop.x, srcW - 1));
            actualCrop.y = Math.max(0, Math.min(actualCrop.y, srcH - 1));
            actualCrop.w = Math.min(actualCrop.w, srcW - actualCrop.x);
            actualCrop.h = Math.min(actualCrop.h, srcH - actualCrop.y);

            const targetWidth = 384; // TrOCR最適サイズ
            const scale = targetWidth / actualCrop.w;
            const targetHeight = Math.floor(actualCrop.h * scale);

            processCanvas.width = targetWidth;
            processCanvas.height = targetHeight;

            processCtx.save();

            if (rotationAngle !== 0) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = actualCrop.w;
                tempCanvas.height = actualCrop.h;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(src, actualCrop.x, actualCrop.y, actualCrop.w, actualCrop.h, 0, 0, actualCrop.w, actualCrop.h);

                if (rotationAngle === 90 || rotationAngle === 270) {
                    processCanvas.width = targetHeight;
                    processCanvas.height = targetWidth;
                }

                processCtx.translate(processCanvas.width / 2, processCanvas.height / 2);
                processCtx.rotate(rotationAngle * Math.PI / 180);
                processCtx.drawImage(tempCanvas, -actualCrop.w * scale / 2, -actualCrop.h * scale / 2, actualCrop.w * scale, actualCrop.h * scale);
            } else {
                processCtx.drawImage(src, actualCrop.x, actualCrop.y, actualCrop.w, actualCrop.h, 0, 0, targetWidth, targetHeight);
            }

            processCtx.restore();

            return processCanvas;
        }

        async function captureAndRecognize() {
            if (!isReady || isProcessing) return;
            isProcessing = true;
            shutterBtn.disabled = true;
            loadingOverlay.classList.remove('d-none');
            loadingText.textContent = '手振れ補正中...';

            try {
                // バースト撮影（5枚）
                const burstCount = 5;
                let bestImage = null;
                let maxSharpness = -1;

                for (let i = 0; i < burstCount; i++) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);

                    const processed = preprocessImage(canvas);
                    const sharpness = calculateSharpness(processCtx, processed.width, processed.height);

                    if (sharpness > maxSharpness) {
                        maxSharpness = sharpness;
                        if (!bestImage) bestImage = document.createElement('canvas');
                        bestImage.width = processed.width;
                        bestImage.height = processed.height;
                        bestImage.getContext('2d').drawImage(processed, 0, 0);
                    }

                    await new Promise(r => setTimeout(r, 50));
                }

                // デバッグ表示
                debugCanvas.width = bestImage.width;
                debugCanvas.height = bestImage.height;
                debugCtx.drawImage(bestImage, 0, 0);

                let text = '';

                if (ocrReady && !useFallback) {
                    // TrOCR使用
                    loadingText.textContent = 'AI認識中...';
                    const result = await ocrPipeline(bestImage);
                    text = result[0]?.generated_text || '';
                    debugInfo.textContent = `TrOCR | スコア: ${maxSharpness} | 回転: ${rotationAngle}°`;
                } else {
                    // Tesseract.jsフォールバック
                    loadingText.textContent = 'OCR中...';
                    const result = await Tesseract.recognize(bestImage, 'eng', {
                        tessedit_pageseg_mode: '7',
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
                    });
                    text = result.data.text;
                    debugInfo.textContent = `Tesseract | スコア: ${maxSharpness} | 回転: ${rotationAngle}°`;
                }

                // クリーンアップ
                text = text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();

                if (text.length > 0) {
                    showSuccess(`読取: ${text}`);
                    addScanResult(text);
                } else {
                    showError("認識できませんでした。\n文字を枠内に大きく入れてください。");
                }
            } catch (err) {
                console.error("OCR Error:", err);
                showError("OCRエラー: 再度お試しください");
            } finally {
                loadingOverlay.classList.add('d-none');
                shutterBtn.disabled = false;
                isProcessing = false;
            }
        }

        function saveToLocal() {
            try { localStorage.setItem('fieldScan_results', JSON.stringify(scanResults)); } catch (e) { }
        }

        function loadFromLocal() {
            try {
                const saved = localStorage.getItem('fieldScan_results');
                if (saved) { scanResults = JSON.parse(saved); updateUI(); }
                const emailTo = localStorage.getItem('fieldScan_emailTo');
                const emailSubject = localStorage.getItem('fieldScan_emailSubject');
                const savedPrev = localStorage.getItem('fieldScan_preventDuplicate');
                const savedRotation = localStorage.getItem('fieldScan_rotation');
                if (emailTo) document.getElementById('emailTo').value = emailTo;
                if (emailSubject) document.getElementById('emailSubject').value = emailSubject;
                if (savedPrev !== null) {
                    preventDuplicate = savedPrev === 'true';
                    preventDuplicateCheckbox.checked = preventDuplicate;
                }
                if (savedRotation !== null) {
                    rotationAngle = parseInt(savedRotation) || 0;
                    updateRotationDisplay();
                }
            } catch (e) { }
        }

        function saveSettings() {
            try {
                localStorage.setItem('fieldScan_emailTo', document.getElementById('emailTo').value);
                localStorage.setItem('fieldScan_emailSubject', document.getElementById('emailSubject').value);
                preventDuplicate = preventDuplicateCheckbox.checked;
                localStorage.setItem('fieldScan_preventDuplicate', preventDuplicate);
                showSuccess("設定を保存しました");
                bootstrap.Collapse.getInstance(document.getElementById('collapseSettings'))?.hide();
            } catch (e) { showError("設定の保存に失敗しました"); }
        }

        function addScanResult(code) {
            if (preventDuplicate && scanResults.includes(code)) {
                showError("重複: " + code);
                return;
            }
            playBeep();
            scanResults.unshift(code);
            saveToLocal();
            updateUI();
        }

        window.removeScanResult = function (index) {
            scanResults.splice(index, 1);
            saveToLocal();
            updateUI();
        };

        function clearAll() {
            showConfirmDialog("リストをすべて削除しますか？", () => {
                scanResults = [];
                saveToLocal();
                updateUI();
                showSuccess("削除しました");
            });
        }

        function updateUI() {
            scanCount.innerText = scanResults.length;
            if (scanResults.length === 0) {
                scanList.innerHTML = '<div class="p-3 text-center text-muted">データがありません。</div>';
            } else {
                scanList.innerHTML = scanResults.map((code, i) => `
                    <div class="scan-item">
                        <span class="code">${code}</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="removeScanResult(${i})">削除</button>
                    </div>
                `).join('');
            }
        }

        function sendEmail() {
            const to = document.getElementById('emailTo').value;
            const subject = document.getElementById('emailSubject').value;
            if (!to) { showError("送信先メールアドレスを設定してください"); return; }
            if (scanResults.length === 0) { showError("データがありません"); return; }
            const body = scanResults.join('\n');
            window.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        shutterBtn.addEventListener('click', captureAndRecognize);
        document.getElementById('clearList').addEventListener('click', clearAll);
        document.getElementById('saveSettings').addEventListener('click', saveSettings);
        document.getElementById('sendEmail').addEventListener('click', sendEmail);

        // 初期化
        window.addEventListener('load', async () => {
            loadFromLocal();
            startCamera();
            await initOCR();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW fail:', e));
            });
        }
    </script>
</body>

</html>
