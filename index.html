<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCR Scanner v38</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <meta name="theme-color" content="#212529">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f8f9fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 140px;
            margin: 0;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-weight: bold;
            font-size: 1rem;
            flex-grow: 1;
            text-align: center;
        }

        .lang-btn {
            background: none;
            border: 1px solid #555;
            color: #aaa;
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: #444;
            color: white;
            border-color: #777;
        }

        /* Input Area */
        .input-section {
            padding: 1rem;
            background: #222;
            border-bottom: 1px solid #444;
        }

        #scanInput {
            font-size: 1.5rem;
            font-family: monospace;
            text-transform: uppercase;
            background: #333;
            color: #4ade80;
            border: 2px solid #555;
            border-radius: 12px;
            width: 100%;
            padding: 1rem;
            resize: none;
        }

        #scanInput:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.2);
        }

        .input-hint {
            color: #888;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
        }

        /* List Section */
        .list-section {
            padding: 1rem;
        }

        .scan-list {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 1rem;
            border: 1px solid #444;
        }

        .scan-item {
            padding: 1rem;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            color: white;
        }

        .scan-item:last-child {
            border-bottom: none;
        }

        .scan-item .code {
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
        }

        .scan-item .code:hover {
            background: #444;
        }

        .text-large {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-send {
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        /* Toast & Dialogs */
        .error-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            z-index: 3000;
            text-align: center;
            max-width: 90%;
        }

        .error-toast.d-none {
            display: none !important;
        }

        .success-toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 135, 84, 0.95);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            z-index: 3000;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .success-toast.d-none {
            display: none !important;
        }

        .confirm-dialog,
        .edit-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .confirm-dialog.d-none,
        .edit-dialog.d-none {
            display: none !important;
        }

        .confirm-content,
        .edit-content {
            background: #333;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
        }

        .edit-content {
            width: 90%;
            max-width: 400px;
        }

        .confirm-buttons {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .edit-content input {
            font-size: 1.5rem;
            font-family: monospace;
            text-align: center;
            text-transform: uppercase;
        }

        /* Settings */
        .accordion-button {
            background-color: #333;
            color: white;
        }

        .accordion-button:not(.collapsed) {
            background-color: #444;
            color: white;
        }

        .accordion-body {
            background-color: #2a2a2a;
        }

        .form-label {
            color: white;
        }

        .form-select {
            background-color: #333;
            color: white;
            border-color: #555;
            margin-bottom: 1rem;
        }

        .form-select:focus {
            background-color: #444;
            color: white;
            border-color: #4ade80;
            box-shadow: none;
        }

        .counter-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #4ade80;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="error-toast d-none" id="errorToast">
        <div id="errorText"></div>
        <button class="btn btn-light btn-sm mt-2" onclick="hideError()" data-i18n="close">閉じる</button>
    </div>
    <div class="success-toast d-none" id="successToast"></div>

    <div class="confirm-dialog d-none" id="confirmDialog">
        <div class="confirm-content">
            <div id="confirmText"></div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" id="confirmCancel" data-i18n="cancel">キャンセル</button>
                <button class="btn btn-danger" id="confirmOk" data-i18n="delete">削除</button>
            </div>
        </div>
    </div>

    <div class="edit-dialog d-none" id="editDialog">
        <div class="edit-content">
            <h5 class="text-white mb-3" data-i18n="editResult">結果を編集</h5>
            <input type="text" class="form-control form-control-lg mb-3" id="editInput" placeholder="CODE">
            <div class="d-flex gap-2">
                <button class="btn btn-secondary flex-fill" id="editCancel" data-i18n="cancel">キャンセル</button>
                <button class="btn btn-primary flex-fill" id="editSave" data-i18n="save">保存</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div style="width: 40px;"></div>
        <div class="header-title">OCR Scanner v38</div>
        <button class="lang-btn" id="langToggle">EN</button>
    </div>

    <div class="input-section">
        <textarea id="scanInput" rows="3" placeholder="ここをタップ → 「テキストをスキャン」" inputmode="text" autocomplete="off"
            autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done"></textarea>
        <div class="input-hint" data-i18n="inputHint">入力欄をタップし、キーボードの「テキストをスキャン」を選択</div>
    </div>

    <div class="list-section">
        <div class="accordion mb-3" id="settingsAccordion">
            <div class="accordion-item border-0">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseSettings" data-i18n="settings">設定</button>
                </h2>
                <div id="collapseSettings" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="company">社名</label>
                            <select class="form-select form-select-lg" id="companySelect">
                                <option value="" selected disabled>社名を選択してください</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="type">種別</label>
                            <select class="form-select form-select-lg" id="typeSelect">
                                <option value="" selected disabled>種別を選択してください</option>
                            </select>
                        </div>
                        <hr class="border-secondary">
                        <div class="mb-3">
                            <label for="emailTo" class="form-label" data-i18n="emailTo">送信先メールアドレス</label>
                            <input type="email" class="form-control form-control-lg" id="emailTo"
                                placeholder="example@company.com">
                        </div>
                        <div class="mb-3">
                            <label for="emailSubject" class="form-label" data-i18n="emailSubject">件名</label>
                            <input type="text" class="form-control form-control-lg" id="emailSubject" value="バーコード作成依頼">
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="preventDuplicate" checked>
                            <label class="form-check-label text-white" for="preventDuplicate"
                                data-i18n="preventDuplicate">重複を防止する</label>
                        </div>
                        <button class="btn btn-primary w-100 btn-lg" id="saveSettings"
                            data-i18n="saveSettings">設定を保存</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-large"><span data-i18n="scanList">スキャン一覧</span> (<span id="scanCount">0</span>)</span>
            <button class="btn btn-outline-danger btn-sm" id="clearList" data-i18n="clearAll">全消去</button>
        </div>

        <div class="scan-list" id="scanList">
            <div class="p-3 text-center text-muted" data-i18n="noData">データなし</div>
        </div>

        <button class="btn btn-primary w-100 btn-send" id="sendEmail" data-i18n="sendEmail">メール送信</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict';

            // --- Customer Data Definition ---
            const companyData = {
                "（株）プライムポリマー　市原LL": ["LL-TY", "LL-TYS"],
                "（株）プライムポリマー　市原EVL": ["EVL-TY", "EVL-TYT"],
                "（株）プライムポリマー　市原HZ": ["HZ-TV", "HZ-TYS"],
                "（株）プライムポリマー　市原PP": ["PP-TV", "PP-TT"]
            };
            // --------------------------------

            let scanResults = [];
            let preventDuplicate = true;
            let confirmCallback = null;
            let editIndex = -1;
            let currentLang = 'ja';

            const translations = {
                ja: {
                    close: '閉じる',
                    cancel: 'キャンセル',
                    delete: '削除',
                    save: '保存',
                    editResult: '結果を編集',
                    inputPlaceholder: 'ここをタップ → 「テキストをスキャン」',
                    inputHint: '入力欄をタップし、キーボードの「テキストをスキャン」を選択',
                    settings: '設定',
                    company: '社名',
                    type: '種別',
                    emailTo: '送信先メールアドレス',
                    emailSubject: '件名',
                    preventDuplicate: '重複を防止する',
                    saveSettings: '設定を保存',
                    scanList: 'スキャン一覧',
                    clearAll: '全消去',
                    noData: 'データなし',
                    sendEmail: 'メール送信',
                    confirmClear: '全てのデータを消去しますか？',
                    cleared: '消去しました',
                    saved: '保存しました',
                    added: '追加: ',
                    duplicate: '重複: ',
                    setAddress: 'メールアドレスを設定してください',
                    noDataToSend: '送信するデータがありません',
                    settingsSaved: '設定を保存しました',
                    saveFailed: '保存に失敗しました',
                    delBtn: '削除',
                    selectCompany: '社名を選択してください',
                    selectType: '種別を選択してください'
                },
                en: {
                    close: 'Close',
                    cancel: 'Cancel',
                    delete: 'Delete',
                    save: 'Save',
                    editResult: 'Edit Result',
                    inputPlaceholder: 'Tap here -> "Scan Text"',
                    inputHint: 'Tap input area, then select "Scan Text" from keyboard',
                    settings: 'Settings',
                    company: 'Company',
                    type: 'Type',
                    emailTo: 'Email To',
                    emailSubject: 'Subject',
                    preventDuplicate: 'Prevent Duplicates',
                    saveSettings: 'Save Settings',
                    scanList: 'Scan List',
                    clearAll: 'Clear All',
                    noData: 'No data.',
                    sendEmail: 'Send Email',
                    confirmClear: 'Clear all data?',
                    cleared: 'Cleared',
                    saved: 'Saved',
                    added: 'Added: ',
                    duplicate: 'Duplicate: ',
                    setAddress: 'Set email address',
                    noDataToSend: 'No data to send',
                    settingsSaved: 'Settings saved',
                    saveFailed: 'Save failed',
                    delBtn: 'Del',
                    selectCompany: 'Select Company',
                    selectType: 'Select Type'
                }
            };

            const scanInput = document.getElementById('scanInput');
            const scanList = document.getElementById('scanList');
            const scanCount = document.getElementById('scanCount');
            const preventDuplicateCheckbox = document.getElementById('preventDuplicate');
            const errorToast = document.getElementById('errorToast');
            const errorText = document.getElementById('errorText');
            const successToast = document.getElementById('successToast');
            const confirmDialog = document.getElementById('confirmDialog');
            const confirmText = document.getElementById('confirmText');
            const editDialog = document.getElementById('editDialog');
            const editInput = document.getElementById('editInput');
            const langToggle = document.getElementById('langToggle');
            const companySelect = document.getElementById('companySelect');
            const typeSelect = document.getElementById('typeSelect');
            const emailSubjectInput = document.getElementById('emailSubject');

            let audioCtx = null;
            function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            function playBeep() {
                try {
                    if (!audioCtx) initAudio();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } catch (e) { }
            }

            function t(key) { return translations[currentLang][key] || key; }

            function updateLanguage(lang) {
                currentLang = lang;
                langToggle.textContent = lang === 'ja' ? 'EN' : 'JP';
                document.documentElement.lang = lang;

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.textContent = t(key);
                });

                scanInput.placeholder = t('inputPlaceholder');

                if (companySelect.options[0]) companySelect.options[0].text = t('selectCompany');
                if (typeSelect.options[0]) typeSelect.options[0].text = t('selectType');

                updateUI();
                localStorage.setItem('fieldScan_lang', lang);
            }

            // --- Company & Type Logic ---
            function initCompanySelect() {
                companySelect.innerHTML = `<option value="" selected disabled>${t('selectCompany')}</option>`;
                for (const company in companyData) {
                    const option = document.createElement('option');
                    option.value = company;
                    option.textContent = company;
                    companySelect.appendChild(option);
                }
            }

            companySelect.addEventListener('change', function () {
                const selectedCompany = this.value;
                const types = companyData[selectedCompany] || [];

                typeSelect.innerHTML = `<option value="" selected disabled>${t('selectType')}</option>`;
                types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeSelect.appendChild(option);
                });

                localStorage.setItem('fieldScan_company', selectedCompany);
                localStorage.removeItem('fieldScan_type');
            });

            typeSelect.addEventListener('change', function () {
                localStorage.setItem('fieldScan_type', this.value);
            });
            // ----------------------------

            langToggle.addEventListener('click', () => {
                updateLanguage(currentLang === 'ja' ? 'en' : 'ja');
            });

            window.showError = function (msg) { errorText.textContent = msg; errorToast.classList.remove('d-none'); };
            window.hideError = function () { errorToast.classList.add('d-none'); };
            function showSuccess(msg) { successToast.textContent = msg; successToast.classList.remove('d-none'); setTimeout(function () { successToast.classList.add('d-none'); }, 1500); }
            function showConfirmDialog(msg, onConfirm) { confirmText.textContent = msg; confirmCallback = onConfirm; confirmDialog.classList.remove('d-none'); }
            function hideConfirmDialog() { confirmDialog.classList.add('d-none'); confirmCallback = null; }
            function showEditDialog(index) { editIndex = index; editInput.value = scanResults[index]; editDialog.classList.remove('d-none'); editInput.focus(); editInput.select(); }
            function hideEditDialog() { editDialog.classList.add('d-none'); editIndex = -1; }
            function saveEdit() { if (editIndex >= 0 && editInput.value.trim()) { scanResults[editIndex] = editInput.value.trim().toUpperCase(); saveToLocal(); updateUI(); showSuccess(t('saved')); } hideEditDialog(); }

            document.getElementById('confirmOk').addEventListener('click', function () { if (confirmCallback) confirmCallback(); hideConfirmDialog(); });
            document.getElementById('confirmCancel').addEventListener('click', hideConfirmDialog);
            document.getElementById('editSave').addEventListener('click', saveEdit);
            document.getElementById('editCancel').addEventListener('click', hideEditDialog);
            editInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') hideEditDialog(); });

            scanInput.addEventListener('input', (e) => {
                const text = e.target.value;
                if (!text) return;

                const noPattern = /(?:No\.?|NO\.?)\s*([A-Z0-9-]+)/i;
                const noMatch = text.match(noPattern);
                if (noMatch) {
                    addScanResult(noMatch[1].toUpperCase());
                    scanInput.value = '';
                    return;
                }

                const patterns = [
                    /[A-Z]{2}\d{4,}/,
                    /\d{5,}/
                ];

                let match = null;
                for (let p of patterns) {
                    const m = text.match(p);
                    if (m) { match = m[0]; break; }
                }

                if (match) {
                    addScanResult(match);
                    scanInput.value = '';
                }
            });

            function saveToLocal() { try { localStorage.setItem('fieldScan_results', JSON.stringify(scanResults)); } catch (e) { } }
            function loadFromLocal() {
                try {
                    var s = localStorage.getItem('fieldScan_results'); if (s) { scanResults = JSON.parse(s); }
                    var e = localStorage.getItem('fieldScan_emailTo'); if (e) document.getElementById('emailTo').value = e;

                    // Force update subject if it's the old default
                    var es = localStorage.getItem('fieldScan_emailSubject');
                    if (es && es !== '在庫報告') {
                        emailSubjectInput.value = es;
                    } else {
                        emailSubjectInput.value = 'バーコード作成依頼'; // Force new default
                    }

                    var p = localStorage.getItem('fieldScan_preventDuplicate'); if (p !== null) { preventDuplicate = p === 'true'; preventDuplicateCheckbox.checked = preventDuplicate; }
                    var l = localStorage.getItem('fieldScan_lang'); if (l) { updateLanguage(l); } else { updateLanguage('ja'); }

                    initCompanySelect();
                    var c = localStorage.getItem('fieldScan_company');
                    if (c && companyData[c]) {
                        companySelect.value = c;
                        const types = companyData[c] || [];
                        typeSelect.innerHTML = `<option value="" selected disabled>${t('selectType')}</option>`;
                        types.forEach(type => {
                            const option = document.createElement('option');
                            option.value = type;
                            option.textContent = type;
                            typeSelect.appendChild(option);
                        });
                        var t_val = localStorage.getItem('fieldScan_type');
                        if (t_val) typeSelect.value = t_val;
                    }

                } catch (e) { }
                updateUI();
            }
            function saveSettings() {
                try {
                    localStorage.setItem('fieldScan_emailTo', document.getElementById('emailTo').value);
                    localStorage.setItem('fieldScan_emailSubject', document.getElementById('emailSubject').value);
                    preventDuplicate = preventDuplicateCheckbox.checked;
                    localStorage.setItem('fieldScan_preventDuplicate', preventDuplicate);

                    // Save company/type selection as well
                    if (companySelect.value) localStorage.setItem('fieldScan_company', companySelect.value);
                    if (typeSelect.value) localStorage.setItem('fieldScan_type', typeSelect.value);

                    showSuccess(t('settingsSaved'));
                    bootstrap.Collapse.getInstance(document.getElementById('collapseSettings'))?.hide();
                } catch (e) { window.showError(t('saveFailed')); }
            }
            function addScanResult(code) {
                if (preventDuplicate && scanResults.includes(code)) { window.showError(t('duplicate') + code); return; }
                playBeep(); scanResults.unshift(code); saveToLocal(); updateUI();
                showSuccess(t('added') + code);
            }
            window.removeScanResult = function (i) { scanResults.splice(i, 1); saveToLocal(); updateUI(); };
            window.editScanResult = function (i) { showEditDialog(i); };
            function clearAll() { showConfirmDialog(t('confirmClear'), function () { scanResults = []; saveToLocal(); updateUI(); showSuccess(t('cleared')); }); }
            function updateUI() {
                scanCount.innerText = scanResults.length;
                if (scanResults.length === 0) { scanList.innerHTML = '<div class="p-3 text-center text-muted">' + t('noData') + '</div>'; }
                else {
                    var html = '';
                    for (var i = 0; i < scanResults.length; i++) {
                        html += '<div class="scan-item"><span class="code" onclick="editScanResult(' + i + ')">' + scanResults[i] + '</span><button class="btn btn-outline-danger btn-sm" onclick="removeScanResult(' + i + ')">' + t('delBtn') + '</button></div>';
                    }
                    scanList.innerHTML = html;
                }
            }
            function sendEmail() {
                var to = document.getElementById('emailTo').value, sub = document.getElementById('emailSubject').value;
                var company = companySelect.value;
                var type = typeSelect.value;

                if (!to) { window.showError(t('setAddress')); return; }
                if (scanResults.length === 0) { window.showError(t('noDataToSend')); return; }

                let body = '';
                if (company) body += company + '\n';
                if (type) body += type + '\n';
                body += '\n';
                body += scanResults.join('\n');

                window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(sub) + '&body=' + encodeURIComponent(body);
            }

            document.getElementById('clearList').addEventListener('click', clearAll);
            document.getElementById('saveSettings').addEventListener('click', saveSettings);
            document.getElementById('sendEmail').addEventListener('click', sendEmail);

            window.addEventListener('load', function () {
                loadFromLocal();
                initAudio();
                scanInput.focus();
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js').catch(function (e) { });
                });
            }
        })();
    </script>
</body>

</html>
